<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Title/description/canonical are rewritten per-product by setProductSeo() below, from
       the ?p= slug. Without that every part page shipped an identical snippet, which is why
       they all sat mid-page with no clicks. -->
  <title>อะไหล่แต่ง BMW ของแท้ ติดตั้งที่พัทยา | Nord Werk Automotive</title>
  <meta name="description" content="อะไหล่แต่งรถยุโรปของแท้ — ดาวน์ไปป์ อินเตอร์คูลเลอร์ ช่วงล่าง โช้คอัพ พร้อมติดตั้งและจูนโดยช่างเฉพาะทาง BMW ที่พัทยา ☎ 082-672-4679" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
  <meta name="theme-color" content="#0e0e12" />
  <link rel="canonical" id="pdCanonical" href="https://nordwerkauto.com/product.html" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="Nord Werk Automotive" />
  <meta property="og:title" content="อะไหล่แต่ง BMW ของแท้ ติดตั้งที่พัทยา — Nord Werk" />
  <meta property="og:description" content="อะไหล่แต่งรถยุโรปของแท้ พร้อมติดตั้งและจูนโดยช่างเฉพาะทาง BMW ที่พัทยา" />
  <meta property="og:image" content="https://nordwerkauto.com/Asset/og-cover.jpg" />
  <meta property="og:locale" content="th_TH" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="Asset/Logo/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" /></noscript>
  <link rel="stylesheet" href="style.css?v=41" />
</head>
<body>

  <!-- ===================== NAV ===================== -->
  <header class="nav scrolled" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo" aria-label="Nord Werk Automotive home">
        <img class="nav__logo-img" src="Asset/Logo/logo-mark.png" alt="Nord Werk Automotive" width="50" height="34" /><span class="nav__logo-word">NORD WERK<small>AUTOMOTIVE</small></span>
      </a>
      <div class="nav__actions">
        <a href="index.html#parts" class="pd-back"><span aria-hidden="true">←</span> <span data-i18n="pd.back">All parts</span></a>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">ไทย</button>
      </div>
    </div>
  </header>

  <!-- ===================== PRODUCT DETAIL ===================== -->
  <main class="product-page">
    <div class="pd-wrap">
      <nav class="pd-crumbs" aria-label="Breadcrumb">
        <a href="index.html">Nord Werk</a> <span>/</span>
        <a href="index.html#parts" data-i18n="pd.parts">Featured Parts</a> <span>/</span>
        <span id="pdCrumb" class="pd-crumbs__current">—</span>
      </nav>

      <div class="pd-grid" id="pdGrid">
        <div class="pd-media">
          <span class="pd-media__stripe" aria-hidden="true"></span>
          <img class="pd-media__img" id="pdImg" alt="" />
        </div>

        <div class="pd-info">
          <span class="pd-brand" id="pdBrand"></span>
          <h1 class="pd-name" id="pdName">—</h1>
          <div class="pd-price" id="pdPriceWrap" hidden><span class="pd-price__num" id="pdPrice"></span></div>
          <p class="pd-fit" id="pdFit"></p>

          <div class="pd-gain" id="pdGainWrap" hidden>
            <span class="pd-gain__label" data-i18n="pd.gain">Power gain</span>
            <strong class="pd-gain__num" id="pdGain"></strong>
            <span class="pd-gain__note" data-i18n="pd.gain.note">with a supporting tune</span>
          </div>

          <p class="pd-desc" id="pdDesc"></p>

          <ul class="pd-features" id="pdFeatures"></ul>

          <div class="pd-models" id="pdModelsWrap" hidden>
            <span class="pd-models__label" data-i18n="pd.models">Fits these models</span>
            <p class="pd-models__list" id="pdModels"></p>
          </div>

          <div class="pd-cta">
            <a href="index.html#contact" class="btn btn--primary" data-i18n="pd.enquire">Enquire &amp; book fitting</a>
            <a href="index.html#parts" class="btn btn--ghost" data-i18n="pd.more">More parts</a>
          </div>

          <p class="pd-note" data-i18n="pd.note">Genuine part professionally fitted &amp; coded at our Pattaya workshop.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="pd-foot">
    <span>© 2026 NORD WERK. All rights reserved.</span>
    <a href="index.html#parts" data-i18n="pd.back">All parts</a>
  </footer>

  <script src="products.js?v=41"></script>
  <script>
    (function () {
      var T = {
        en: {
          "pd.back": "All parts", "pd.parts": "Featured Parts", "pd.gain": "Power gain",
          "pd.gain.note": "with a supporting tune", "pd.models": "Fits these models",
          "pd.enquire": "Enquire & book fitting", "pd.more": "More parts",
          "pd.note": "Genuine part professionally fitted & coded at our Pattaya workshop.",
          "pd.notfound": "Sorry, we couldn't find that part."
        },
        th: {
          "pd.back": "อะไหล่ทั้งหมด", "pd.parts": "อะไหล่แนะนำ", "pd.gain": "แรงม้าที่เพิ่ม",
          "pd.gain.note": "เมื่อจูนร่วมด้วย", "pd.models": "รองรับรุ่นเหล่านี้",
          "pd.enquire": "สอบถาม & นัดติดตั้ง", "pd.more": "อะไหล่อื่น ๆ",
          "pd.note": "ติดตั้งและโค้ดดิ้งอะไหล่แท้อย่างมืออาชีพที่อู่ของเราในพัทยา",
          "pd.notfound": "ขออภัย ไม่พบอะไหล่ชิ้นนี้"
        }
      };
      var LANG = localStorage.getItem("nw_lang") === "th" ? "th" : "en";

      // currency (mirrors script.js CURRENCIES so the price matches the homepage selector)
      var CUR = {
        THB: { s: "฿", r: 1, dp: 0 }, USD: { s: "$", r: 0.028, dp: 2 }, CNY: { s: "¥", r: 0.20, dp: 2 },
        EUR: { s: "€", r: 0.026, dp: 2 }, RUB: { s: "₽", r: 2.5, dp: 0 }
      };
      var CURRENCY = CUR[localStorage.getItem("nw_cur")] ? localStorage.getItem("nw_cur") : "THB";
      function fmtPrice(thb) {
        var c = CUR[CURRENCY] || CUR.THB;
        return c.s + (thb * c.r).toLocaleString("en-US", { minimumFractionDigits: c.dp, maximumFractionDigits: c.dp });
      }

      function applyChrome() {
        document.documentElement.lang = LANG;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (T[LANG][k]) el.textContent = T[LANG][k];
        });
        var lt = document.getElementById("langToggle");
        if (lt) lt.textContent = LANG === "en" ? "ไทย" : "ENG";
      }

      var slug = new URLSearchParams(location.search).get("p");
      var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v || ""; };

      /* ---------------------------------------------------------------
         Per-product SEO. Every part page used to ship the same <title>
         and description, so Google treated them as near-duplicates. This
         gives each one a unique, Thailand-targeted snippet plus Product
         and BreadcrumbList structured data.
         --------------------------------------------------------------- */
      function setMeta(sel, attr, val) {
        var el = document.head.querySelector(sel);
        if (el) el.setAttribute(attr, val);
      }

      function setProductSeo(P) {
        var full  = P.brand + " " + P.name;
        var url   = "https://nordwerkauto.com/product.html?p=" + P.slug;
        var price = P.priceTHB ? "฿" + P.priceTHB.toLocaleString("en-US") + " " : "";

        document.title = full + " ราคา " + price + "· ติดตั้งที่พัทยา | Nord Werk";

        var desc = full + " — " + (P.fit || "อะไหล่แต่งรถยุโรป") + ". "
                 + (price ? "ราคา " + price + "พร้อมติดตั้ง" : "สอบถามราคา")
                 + (P.gain ? " · " + P.gain : "")
                 + " ติดตั้งและจูนโดยช่างเฉพาะทาง BMW ที่พัทยา ☎ 082-672-4679";
        desc = desc.slice(0, 300);

        setMeta('meta[name="description"]', "content", desc);
        setMeta('meta[property="og:title"]', "content", full + " — Nord Werk Pattaya");
        setMeta('meta[property="og:description"]', "content", desc);
        setMeta('meta[property="og:url"]', "content", url);
        if (P.img) setMeta('meta[property="og:image"]', "content", "https://nordwerkauto.com/" + P.img);
        var can = document.getElementById("pdCanonical");
        if (can) can.setAttribute("href", url);

        var ld = {
          "@context": "https://schema.org",
          "@type": "Product",
          "name": full,
          "brand": { "@type": "Brand", "name": P.brand },
          "description": P.desc || desc,
          "sku": P.slug,
          "url": url,
          "category": "Auto Parts",
          "offers": {
            "@type": "Offer",
            "url": url,
            "priceCurrency": "THB",
            "availability": "https://schema.org/InStock",
            "itemCondition": "https://schema.org/NewCondition",
            "areaServed": { "@type": "Country", "name": "Thailand" },
            "seller": { "@type": "AutoRepair", "name": "Nord Werk Automotive", "@id": "https://nordwerkauto.com/#garage" }
          }
        };
        if (P.img) ld.image = "https://nordwerkauto.com/" + P.img;
        if (P.priceTHB) ld.offers.price = String(P.priceTHB);

        var crumbs = {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Nord Werk", "item": "https://nordwerkauto.com/" },
            { "@type": "ListItem", "position": 2, "name": "Featured Parts", "item": "https://nordwerkauto.com/#parts" },
            { "@type": "ListItem", "position": 3, "name": full }
          ]
        };

        [ld, crumbs].forEach(function (obj) {
          var s = document.createElement("script");
          s.type = "application/ld+json";
          s.textContent = JSON.stringify(obj);
          document.head.appendChild(s);
        });
      }

      function renderProduct(P) {
        if (!P) {
          document.getElementById("pdName").textContent = T[LANG]["pd.notfound"];
          document.getElementById("pdGrid").classList.add("pd-grid--missing");
          // Don't let Google index an empty "not found" page for a bad slug.
          setMeta('meta[name="robots"]', "content", "noindex, follow");
          applyChrome();
          return;
        }
        setProductSeo(P);
        var img = document.getElementById("pdImg");
        img.onerror = function () { img.style.display = "none"; };
        img.alt = P.brand + " " + P.name;
        img.src = P.img;
        set("pdCrumb", P.name);
        set("pdBrand", P.brand);
        set("pdName", P.name);
        if (P.priceTHB) { set("pdPrice", fmtPrice(P.priceTHB)); document.getElementById("pdPriceWrap").hidden = false; }
        set("pdFit", P.fit);
        if (P.gain) { set("pdGain", P.gain); document.getElementById("pdGainWrap").hidden = false; }
        set("pdDesc", P.desc);
        if (P.models) { set("pdModels", P.models); document.getElementById("pdModelsWrap").hidden = false; }
        var ul = document.getElementById("pdFeatures");
        ul.innerHTML = (P.features || []).map(function (f) { return "<li>" + f + "</li>"; }).join("");
        applyChrome();
      }

      // load from the Google Sheet (or built-in list), then render the matching product
      var loader = (typeof window.loadProducts === "function")
        ? window.loadProducts() : Promise.resolve(window.PRODUCTS || []);
      loader.then(function (list) {
        renderProduct((list || []).filter(function (x) { return x.slug === slug; })[0]);
      });

      applyChrome();   // translate the static labels right away

      var lt = document.getElementById("langToggle");
      if (lt) lt.addEventListener("click", function () {
        LANG = LANG === "en" ? "th" : "en";
        localStorage.setItem("nw_lang", LANG);
        applyChrome();
      });
    })();
  </script>
</body>
</html>
